name: 'Require milestone on pull requests'

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize
      - ready_for_review
      - milestoned
      - demilestoned
    branches:
        - trunk

permissions:
  pull-requests: read

jobs:
  ensure-milestone:
    name: 'Ensure milestone is assigned'
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: 'Validate milestone or checkbox selection'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
            });

            // If milestone is already set, we're done
            if (pr.milestone) {
                core.info(`Milestone "${pr.milestone.title}" is set.`);
                return;
            }

            const body = pr.body || '';

            // Check for milestone selection markers
            if (!body.includes('<!-- milestone-target-selection -->')) {
                core.setFailed('Milestone selection section not found in PR description. Please use the PR template and select a milestone option, or manually assign a milestone.');
                return;
            }

            // Parse checkbox states
            const nextVersionMatch = body.match(/- \[([ xX])\].*\*\*.*next WooCommerce version.*\*\*/);
            const patchVersionMatch = body.match(/- \[([ xX])\].*\*\*previous version patch\*\*/);

            if (!nextVersionMatch || !patchVersionMatch) {
                core.setFailed('Milestone selection checkboxes not found or modified. Please restore the original checkbox format from the PR template.');
                return;
            }

            const nextVersionChecked = nextVersionMatch[1].toLowerCase() === 'x';
            const patchVersionChecked = patchVersionMatch[1].toLowerCase() === 'x';

            if (nextVersionChecked && patchVersionChecked) {
                core.setFailed('Both milestone options are selected. Please select only one.');
                return;
            }

            if (!nextVersionChecked && !patchVersionChecked) {
                core.setFailed('No milestone option selected. Please select one option or manually assign a milestone.');
                return;
            }

            const selection = nextVersionChecked ? 'next WooCommerce version' : 'previous version patch';
            core.info(`Milestone selection: "${selection}". Milestone will be assigned on merge.`);